name: PR Gates

# Evaluates every open PR against CURRENT master (fresh fetch, synthetic merge
# commit — never the stale base). Posts checks; the integrate workflow merges.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re-)evaluate"
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gates-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    name: controller-gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    outputs:
      verdict: ${{ steps.classify.outputs.verdict }}
    steps:
      - name: Resolve PR number
        id: prnum
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "n=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "n=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR metadata + diff (derive from GitHub, never from agent claims)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
          PR: ${{ steps.prnum.outputs.n }}
        run: |
          gh pr view "$PR" --json number,title,body,baseRefOid,headRefOid,potentialMergeCommit,mergeable,commits,author > pr.json
          if ! gh pr diff "$PR" --patch > additions.diff 2>/dev/null; then
            # GitHub's diff API refuses >20k-line PRs (HTTP 406). Derive the patch from git
            # instead — same content, no size cap. fetch-depth: 0 above guarantees the objects.
            git fetch -q origin "refs/pull/$PR/head"
            git diff "origin/master...FETCH_HEAD" > additions.diff
          fi

      - name: Compute changed files + meta.json
        run: |
          python - <<'PY'
          import json, subprocess
          pr = json.load(open("pr.json"))
          base, head = pr["baseRefOid"], pr["headRefOid"]
          merge = pr.get("potentialMergeCommit") or ""
          out = subprocess.run(["git", "diff", "--name-only", f"{base}...{head}"],
                               capture_output=True, text=True, check=True).stdout
          mb = subprocess.run(["git", "merge-base", base, head],
                              capture_output=True, text=True).stdout.strip()
          files = [l for l in out.splitlines() if l.strip()]
          open("changed.txt", "w").write("\n".join(files) + ("\n" if files else ""))
          meta = {
            "pr": pr["number"], "title": pr["title"], "body": pr.get("body") or "",
            "base_sha": base, "head_sha": head, "merge_sha": merge, "merge_base": mb,
            "mergeable": (pr.get("mergeable") or "unknown").lower(),
            "commits": len(pr.get("commits") or []),
            "author": (pr.get("author") or {}).get("login", "?"),
          }
          json.dump(meta, open("meta.json", "w"))
          print(f"PR#{pr['number']} base={base[:8]} head={head[:8]} mergeable={meta['mergeable']} files={len(files)}")
          PY

      - name: Ownership / scope / security classification
        id: classify
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set +e
          python scripts/integration/livora_gates.py | tee gate-output.txt
          rc=${PIPESTATUS[0]}
          case $rc in
            0) v=GREEN ;; 1) v=YELLOW ;; *) v=RED ;;
          esac
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          {
            echo "## Controller gate — PR#${{ steps.prnum.outputs.n }}"; echo
            echo "Verdict: **$v** — classification only (build/tests are separate gates)"; echo
            echo '```'
            cat gate-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ steps.prnum.outputs.n }}" --body "controller gate verdict: **$v** (details in the run summary)" || true

      - name: Hard stop on RED (YELLOW proceeds so the coordinator sees build/test too)
        if: steps.classify.outputs.verdict == 'RED'
        run: exit 1

  build-test:
    name: verify merge state (base HEAD + PR applied)
    needs: gate
    runs-on: windows-latest
    steps:
      - name: Checkout PR merge ref (kills stale-baseline false-greens)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/merge

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Unit tests (Release)
        run: dotnet test Tests/LIVORA.Tests.csproj --configuration Release

      - name: App build (Windows head — test project cannot see XAML/DI breaks)
        run: dotnet build LIVORA.csproj -f net10.0-windows10.0.19041.0 -c Release

  server-gates:
    name: server gates (build + server tests + client perf-isolated suite)
    needs: gate
    if: needs.gate.result == 'success' || needs.gate.result == 'skipped'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/merge
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Gate 1 — backend compiles clean; server/Directory.Build.props sets
      # TreatWarningsAsErrors=true, so 0W is part of the verdict, not a nicety.
      - name: server build (warnings are errors)
        run: dotnet build server/src/Livora.Server/Livora.Server.csproj -v q --nologo

      # Gate 2a — the real-host contract suite WITHOUT the self-nesting harness test.
      # WHY split: Wave4GateTests.GateHarness spawns its own child builds+full suites; with xunit
      # running every other collection against it on a 4-core runner, the nested Quality timing
      # budgets (Wave4PerformanceBudget) measure SELF-contention, not the product — the exact
      # contention class FLAKE-STORAGE-BUDGET.md documents. Same no-weakening remedy as 3a/3b:
      # every test still runs exactly once; the harness gets a quiet machine in 2b.
      - name: server tests (parallel suite, harness isolated to next step)
        run: >
          dotnet test server/tests/Livora.Server.Tests/Livora.Server.Tests.csproj --nologo -v q
          --filter "FullyQualifiedName!~Wave4GateTests.GateHarness"

      # Gate 2b — the §3 release-gate harness ALONE, serialised: its children then run against an
      # otherwise-idle runner, so receipts measure the contract commands, not runner contention.
      - name: release-gate harness (alone, serial)
        run: >
          dotnet test server/tests/Livora.Server.Tests/Livora.Server.Tests.csproj --nologo -v q
          --filter "FullyQualifiedName~Wave4GateTests.GateHarness"
          -- RunConfiguration.MaxParallelThreads=1

      # Gate 3a — client timed budgets, ISOLATED and serialised.
      # WHY: StoragePerformanceBudgetTests reads process-wide GC counters and wall-clock budgets
      # while xunit runs every other class in parallel against them — ~19% of one-command full runs
      # go red without any code change (docs/quality/wave4/FLAKE-STORAGE-BUDGET.md, 26 measured
      # full-suite runs). The class ships [Trait("category","Wave3c-Perf")]; the split costs ~2 s.
      - name: client perf budgets (isolated, serial)
        run: >
          dotnet test Tests/LIVORA.Tests.csproj --nologo -v q
          --filter "category=Wave3c-Perf"
          -- RunConfiguration.MaxParallelThreads=1

      # Gate 3b — the remaining client tests in full parallel (measured: unaffected by 3a).
      - name: client tests (rest, parallel)
        run: dotnet test Tests/LIVORA.Tests.csproj --nologo -v q --filter "category!=Wave3c-Perf"

      # Upload receipts: the Wave4Gate harness child logs land under the runner TEMP
      # (Path.GetTempPath() == %RUNNER_TEMP% on hosted runners).
      - name: attach gate harness receipts (if the harness ran)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-gate-logs
          path: '${{ runner.temp }}/livora-wave4-gates'
          if-no-files-found: ignore

  report:
    name: roll-up status
    needs: [gate, build-test, server-gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final classification
        env:
          VERDICT: ${{ needs.gate.outputs.verdict }}
          BUILD: ${{ needs.build-test.result }}
          SERVER: ${{ needs.server-gates.result }}
        run: |
          echo "gate=$VERDICT build=$BUILD server=$SERVER" | tee -a "$GITHUB_STEP_SUMMARY"
          # This job is the SINGLE merge authority: success => auto-merge eligible.
          if [ "$BUILD" != "success" ]; then echo "RED — build/tests failed ($BUILD)"; exit 1; fi
          if [ "$SERVER" = "failure" ] || [ "$SERVER" = "cancelled" ]; then
            echo "RED — server gates failed ($SERVER)"; exit 1
          fi
          case "$VERDICT" in
            GREEN)  echo "GREEN — integrate workflow may merge this PR"; exit 0 ;;
            YELLOW) echo "::warning::HELD for coordinator review (YELLOW)"; exit 1 ;;
            *)      echo "RED — gate verdict $VERDICT"; exit 1 ;;
          esac
