name: Release

# Builds every deliverable a GitHub-hosted runner can produce:
#   - Android: universal APK + AAB (signed with repo keystore secret, or an
#     ephemeral dev keystore when not configured — labeled in the release body)
#   - Windows: unpackaged self-contained win-x64 (zip)
#   - iOS: simulator .app (zip) + best-effort device .app (zip, unsigned)
#   - macOS Catalyst: .app bundle (zip, ad-hoc signed for local runs)
# Then publishes them all to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 1.1.0). Defaults to 99.0.0-rc.<run> when empty."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_num: ${{ steps.ver.outputs.version_num }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$INPUT_VERSION"
            [ -z "$VERSION" ] && VERSION="99.0.0-rc.${GITHUB_RUN_NUMBER}"
          fi
          # Numeric core for MSBuild version properties (no -rc/+hash suffixes)
          NUM="${VERSION%%+*}"; NUM="${NUM%%-*}"
          IFS='.' read -r MA MI PA <<< "$NUM"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          if [[ "$VERSION" == *-* ]]; then CODE="$((10000000 + GITHUB_RUN_NUMBER))"; else CODE="$(( MA*10000 + MI*100 + PA ))"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$NUM" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (numeric $NUM, code $CODE)"

  android:
    name: Android (APK + AAB)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI workloads
        shell: bash
        run: dotnet workload install maui-android android

      - name: Prepare signing keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.LIVORA_KEYSTORE_B64 }}
          KS_SECRET_PASS: ${{ secrets.LIVORA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KS_B64" ]; then
            echo "Using repo release keystore"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/livora.jks"
            echo "KS_PASS=$KS_SECRET_PASS" >> "$GITHUB_ENV"
          else
            echo "No keystore secret configured -> generating EPHEMERAL dev keystore (installable, NOT distribution-key signed)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks/livora.jks" \
              -storepass livora-dev -keypass livora-dev -alias livora \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LIVORA Dev, OU=CI, O=LIVORA, L=Unknown, C=US"
            echo "KS_PASS=livora-dev" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/ks/livora.jks" >> "$GITHUB_ENV"

      - name: Build APK (universal)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish LIVORA.csproj -f net10.0-android -c Release `
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} `
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$env:KS_PATH" `
            "-p:AndroidSigningStorePass=$env:KS_PASS" `
            -p:AndroidSigningKeyAlias=livora `
            "-p:AndroidSigningKeyPass=$env:KS_PASS" `
            -p:AndroidUniversalRid=true `
            -o publish-android
          exit $LASTEXITCODE

      - name: Build AAB (Play Store upload bundle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish LIVORA.csproj -f net10.0-android -c Release `
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} `
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$env:KS_PATH" `
            "-p:AndroidSigningStorePass=$env:KS_PASS" `
            -p:AndroidSigningKeyAlias=livora `
            "-p:AndroidSigningKeyPass=$env:KS_PASS" `
            -o publish-android-aab
          exit $LASTEXITCODE

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          APK=$(find publish-android -name "*.apk" | head -1)
          AAB=$(find publish-android-aab -name "*.aab" | head -1)
          [ -z "$APK" ] && { find . -name "*.apk" | head; exit 1; }
          [ -z "$AAB" ] && { find . -name "*.aab" | head; exit 1; }
          cp "$APK" "out/LIVORA-${{ needs.meta.outputs.version }}.apk"
          cp "$AAB" "out/LIVORA-${{ needs.meta.outputs.version }}.aab"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  windows:
    name: Windows (unpackaged win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install MAUI workloads
        shell: bash
        run: dotnet workload install maui-windows
      - name: Build unpackaged app (win-x64)
        shell: bash
        run: |
          # TargetFrameworks override: without it the implicit multi-TFM restore
          # evaluates the android inner build too, which demands Mono runtime packs
          # for whatever RID is global on the CLI (the NU1102 this replaced).
          set -o pipefail
          dotnet build LIVORA.csproj -f net10.0-windows10.0.19041.0 -c Release \
            -p:TargetFrameworks=net10.0-windows10.0.19041.0 \
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} \
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} \
            2>&1 | tail -n 60
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $dir = Get-ChildItem "bin/Release" -Directory | Where-Object Name -like "net10.0-windows*" | Select-Object -First 1
          $payload = Join-Path $dir.FullName "win-x64"
          if (-not (Test-Path "$payload/LIVORA.exe")) { Write-Error "no LIVORA.exe under $payload"; exit 1 }
          Compress-Archive -Path "$payload/*" -DestinationPath "out/LIVORA-${{ needs.meta.outputs.version }}-win-x64.zip" -Force
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  ios:
    name: iOS (simulator + device .app)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install MAUI workloads
        run: dotnet workload install maui
      - name: Build (simulator)
        run: |
          set -o pipefail
          dotnet build LIVORA.csproj -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} \
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} \
            2>&1 | tail -n 60
      - name: Build (device, ad-hoc signed)  # best-effort: no distribution cert on hosted runners
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build LIVORA.csproj -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} \
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} \
            -p:AutomaticSigning=false \
            -p:CodesignKey="-" \
            -p:CodesignProvision="" \
            -p:BuildIpa=false \
            2>&1 | tee device-build.log | tail -n 60
      - name: Package payloads
        shell: bash
        run: |
          mkdir -p out
          SIM=$(find bin obj -path "*iossimulator*" -name "*.app" -type d 2>/dev/null | grep -v "\.dSYM" | head -1)
          DEV=$(find bin obj -path "*ios-arm64*" -name "*.app" -type d 2>/dev/null | grep -v "iossimulator\|\.dSYM" | head -1)
          echo "SIM=$SIM DEV=$DEV"
          [ -z "$SIM" ] && { echo "no iOS simulator .app payload found (device build may have produced one)"; }
          [ -z "$SIM" ] && [ -z "$DEV" ] && { find . -maxdepth 6 -name "*.app" -type d | head -20; exit 1; }
          if [ -n "$SIM" ]; then (cd "$(dirname "$SIM")" && zip -qr "$GITHUB_WORKSPACE/out/LIVORA-${{ needs.meta.outputs.version }}-ios-simulator.app.zip" "$(basename "$SIM")"); fi
          if [ -n "$DEV" ]; then (cd "$(dirname "$DEV")" && zip -qr "$GITHUB_WORKSPACE/out/LIVORA-${{ needs.meta.outputs.version }}-ios-device-unsigned.app.zip" "$(basename "$DEV")"); fi
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/

  macos:
    name: Mac Catalyst (.app)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Only the platform-specific id: bare `maui` is the legacy meta-workload
      # (pulls android/ios/tvos packs too and can mix SDK versions). Fail loudly —
      # a silent workload-install failure later shows up as a cryptic build error.
      - name: Install MAUI workloads
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet workload install maui-maccatalyst 2>&1 | tee workload-install.log | tail -n 40; then
            echo "::error::'dotnet workload install maui-maccatalyst' failed — Mac Catalyst SDK/AOT packs are not installed"
            exit 1
          fi
      - name: Show workloads
        shell: bash
        run: |
          dotnet workload list 2>&1 | tee workload-list.log || true
          grep -qi "maccatalyst" workload-list.log || echo "::warning::'dotnet workload list' does not mention maccatalyst — check the install step above"
      - name: Publish
        shell: bash
        run: |
          # No -o: for Apple platforms the .app bundle is built in place under
          # bin/Release/<tfm>/<rid>/LIVORA.app; a -o publish dir only receives the
          # copied payloads plus the installer .pkg, which is what hid the bundle
          # from the old `find publish-mac -name "*.app"`. CreatePackage=false skips
          # the ~85s installer .pkg we don't ship.
          # '|| rc=$?' keeps the real MSBuild exit code under Actions' 'bash -e'
          # (an unguarded failure would abort the step before the error annotation).
          rc=0
          dotnet publish LIVORA.csproj -f net10.0-maccatalyst -c Release \
            -p:RuntimeIdentifier=maccatalyst-arm64 \
            -p:CreatePackage=false \
            -p:ApplicationDisplayVersion=${{ needs.meta.outputs.version_num }} \
            -p:ApplicationVersion=${{ needs.meta.outputs.version_code }} \
            > publish-mac.log 2>&1 || rc=$?
          tail -n 60 publish-mac.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::'dotnet publish -f net10.0-maccatalyst' failed (exit $rc) — full log in publish-mac.log above"
            exit "$rc"
          fi
      - name: Show publish tree
        shell: bash
        run: |
          # Informational only — never fail the job on a missing candidate dir.
          # (Parenthesized -o so BSD/macOS find doesn't choke on the second -maxdepth.)
          find bin publish-mac -maxdepth 4 \( -name "*.app" -o -name "*.dll" \) 2>/dev/null | head -40 || true
          echo "--- *.app anywhere ---"
          find . -maxdepth 8 -type d -name "*.app" 2>/dev/null | grep -v "\.dSYM" | head -20 || true
      - name: Ad-hoc sign + zip
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -uo pipefail
          # Space-separated (deliberately unquoted below) so this stays bash 3.2-safe:
          # the runner's /bin/bash is 3.2, where empty arrays trip 'set -u'.
          roots=""
          for r in bin publish-mac; do [ -d "$r" ] && roots="$roots $r"; done
          roots=$(echo $roots)
          [ -z "$roots" ] && { echo "::error::no build output tree (bin/ or publish-mac/) after publish"; exit 1; }
          # Prefer a bundle under a maccatalyst path, else any .app we found.
          APP=$(find $roots -type d -name "*.app" 2>/dev/null | grep -v "\.dSYM" | grep -i "maccatalyst" | head -n 1 || true)
          if [ -z "$APP" ]; then APP=$(find $roots -type d -name "*.app" 2>/dev/null | grep -v "\.dSYM" | head -n 1 || true); fi
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle found under $roots"
            find . -maxdepth 6 -type d -name "*.app" 2>/dev/null | head -20 || true
            tail -n 40 publish-mac.log 2>/dev/null || true
            exit 1
          fi
          APPDIR=$(cd "$(dirname "$APP")" && pwd -P)
          APPNAME=$(basename "$APP")
          echo "payload: $APP (dir: $APPDIR, bundle: $APPNAME)"
          [ -f "$APP/Contents/Info.plist" ] || echo "::warning::$APPNAME has no Contents/Info.plist — unexpected bundle layout"
          [ -d "$APP/Contents/MacOS" ] || echo "::warning::$APPNAME has no Contents/MacOS — unexpected bundle layout"
          if codesign --force --deep --sign - "$APP" 2>codesign.log; then
            codesign --verify --deep --verbose=2 "$APP" 2>&1 | tail -n 5 || true
            echo "ad-hoc signed"
          else
            echo "::warning::ad-hoc codesign failed — artifact ships unsigned:"
            tail -n 10 codesign.log || true
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          ZIP="$GITHUB_WORKSPACE/out/LIVORA-$VER-mac-catalyst.app.zip"
          rm -f "$ZIP"
          # zip from the bundle's parent so the archive root IS LIVORA.app/...
          # -y keeps the bundle's symlinks as symlinks (breaks the layout otherwise)
          ( cd "$APPDIR" && zip -qry "$ZIP" "$APPNAME" )
          [ -s "$ZIP" ] || { echo "::error::zip was not created or is empty: $ZIP"; exit 1; }
          # sanity: the archive's root must be the bundle itself (LIVORA.app/...)
          unzip -Z1 "$ZIP" > ziplist.txt 2>/dev/null || { echo "::error::cannot list $ZIP"; exit 1; }
          head -5 ziplist.txt
          grep -Eq "^$APPNAME/?$" ziplist.txt || {
            echo "::error::zip root does not contain $APPNAME (listing above)"; exit 1; }
          ls -la "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.zip

  release:
    name: Publish GitHub Release
    needs: [meta, android, windows, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag name
        id: tag
        env:
          REF: ${{ github.ref }}
          RUN_TAG: ${{ github.ref_name }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then echo "tag=$RUN_TAG" >> "$GITHUB_OUTPUT"; else echo "tag=v$VER" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Flatten
        run: |
          mkdir -p flat
          find assets -type f -not -name ".artifact_metadata" -exec cp {} flat/ \;
          ls -la flat/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: LIVORA ${{ needs.meta.outputs.version }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          body: |
            ## LIVORA ${{ needs.meta.outputs.version }}

            | Platform | File | Status |
            |---|---|---|
            | Android | `*.apk` | signed (repo or ephemeral dev keystore) · installable |
            | Android | `*.aab` | Play Store upload bundle |
            | Windows | `*-win-x64.zip` | unpackaged app (needs .NET 10 Desktop Runtime installed) |
            | iOS simulator | `*-ios-simulator.app.zip` | runs on Apple-Silicon simulator |
            | iOS device | `*-ios-device-unsigned.app.zip` | UNSIGNED — needs a distribution cert + profile to install |
            | macOS | `*-mac-catalyst.app.zip` | ad-hoc signed, local runs only |

            CI-generated artifacts. Unsigned/limited items are labeled honestly —
            store distribution requires signing secrets that are not in this repo.
          files: flat/*
