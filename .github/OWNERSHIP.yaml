# LIVORA ownership registry — SOURCE OF TRUTH for agent scope.
# Enforced by .github/workflows/pr-gates.yml (scope job) and scripts/integration/livora_gates.py.
# Classification result order: RED > YELLOW > GREEN. First matching rule wins, most-specific path first.

version: 1

# ---- Global policy -----------------------------------------------------------
policy:
  master_push_forbidden: true          # humans/agents push branches + PRs; only the controller merges
  rebase_policy: safe_only             # never force-push a foreign branch; merge-candidate tested instead
  auto_merge_max_changed_files: 40     # bigger -> YELLOW (oversized change needs review)
  squash_merge: true                   # one commit per lane on master, ledger records PR head SHA
  stale_base_seconds: 86400            # base older than master HEAD@T by more than this -> refresh required

# ---- Integration-owned (shared) files: any lane edit -> YELLOW ----------------
# These are the files every wave wants to touch. Lanes deliver APPEND blocks;
# ONLY the integration lead applies them, on an integration branch, via PR.
integration_owned:
  # ---- WAVE 4 backend: the host composition root + shared seams (lead applies only) ----
  - server/src/Livora.Server/Program.cs
  - server/src/Livora.Server/Modules/IFlivoraModule.cs
  - server/src/Livora.Server/Modules/ModuleRegistry.cs
  - server/src/Livora.Server/Platform/**
  - server/src/Livora.Server/appsettings.json
  - server/src/Livora.Server.Infrastructure/Persistence/LivoraDbContext.cs
  - server/src/Livora.Server.Infrastructure/Persistence/Entities.cs
  - server/src/Livora.Server.Infrastructure/Persistence/ModelSnapshots/**
  - server/src/Livora.Server.Application/ApiProblem.cs
  - server/src/Livora.Server.Application/Authorization.cs
  - server/src/Livora.Server.Application/Paging.cs
  - server/tests/Livora.Server.Tests/Fixtures/**
  - server/tests/Livora.Server.Tests/GlobalUsings.cs
  - server/**/Directory.Build.props
  - MauiProgram.cs
  - AppShell.xaml
  - AppShell.xaml.cs
  - App.xaml
  - App.xaml.cs
  - LIVORA.csproj
  - LIVORA.slnx
  - Tests/LIVORA.Tests.csproj
  - Resources/Localization/AppResources.resx
  - Resources/Localization/AppResources.fa.resx
  - Presentation/Views/Settings/SettingsPage.xaml
  - Presentation/ViewModels/Settings/SettingsViewModel.cs
  - Presentation/Theme.cs
  - Presentation/Components/TrExtension.cs
  - Resources/Styles/**
  - global.json
  - .gitignore
  - .gitattributes
  - docs/agents/**

# ---- Frozen contracts: lane edits -> RED (amendment = lead-only PR) ----------
frozen:
  owner: lead
  paths:
    - Application/Abstractions/**
    - Domain/Enums/**
    - Application/Rules/RuleEngine.cs
    - Tests/Tests/ApplicationPurityTests.cs
    - Tests/Tests/Wave3Harness.cs
    - Tests/Tests/TestFakes.cs

# ---- Architecture config (workflow files, registry, scripts): RED for lanes --
architecture_owned:
  owner: lead
  paths:
    - .github/**
    - scripts/**
    - docs/LANES*.md
    - docs/WAVE3*.md
    - docs/architecture/**

# ---- Lane registry ------------------------------------------------------------
