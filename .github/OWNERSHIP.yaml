# ---- Overlap groups: lanes whose product areas intersect; a PR spanning two
#      members -> CROSS_LANE_IMPACT (YELLOW), lead arbitrates merge order.
overlap_groups:
  - name: planning-domain
    lanes: [w3b-lane05, integration-w3c, w3c-lane05]
    note: baselines vs adaptive planning — both feed Application/Planning; reconcile via lead
  - name: security-keys
    lanes: [w3c-lane01b, w3c-lane02]
    note: key blob ownership — exactly one key implementation may win
