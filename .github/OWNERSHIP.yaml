      - server/src/Livora.Server.Infrastructure/Sync/**
      - server/src/Livora.Server.Infrastructure/Observability/**
      - server/src/Livora.Server.Infrastructure/Persistence/**
      - server/tests/Livora.Server.Tests/Sync/**
      - server/tests/Livora.Server.Tests/Persistence/**
      - server/tests/Livora.Server.Tests/Platform/**
    status: active
  - id: w4-p1c-identity
    agent: agent-03
    wave: 4
    branch: wave4/p1c/identity
    task: identity module - register/login/refresh/revoke, Google verifier seam, lockout, deletion
