# LIVORA ownership registry — SOURCE OF TRUTH for agent scope (POLICY layer).
# Enforced by .github/workflows/pr-gates.yml (scope job) and
# scripts/integration/livora_gates.py + scripts/integration/governance/ engine.
# Version 2: lifecycle model, explicit precedence, exclusivity, self-validation.
# The engine validates THIS file on every gate run; an invalid registry is RED.
# Governance model: docs/architecture/governance/GOVERNANCE_MODEL.md

version: 2

# ---- Global policy -----------------------------------------------------------
policy:
  master_push_forbidden: true          # humans/agents push branches + PRs; only the controller merges
  rebase_policy: safe_only             # never force-push a foreign branch; merge-candidate tested instead
  auto_merge_max_changed_files: 40     # bigger -> YELLOW (oversized change needs review)
  squash_merge: true                   # one commit per lane on master, ledger records PR head SHA
  base_branch: master                  # staleness + ancestry are computed against this
  stale_commits_threshold: 25          # branch-only topology: master commits since merge-base
  # GitHub actor -> lane binding. An open PR by actor X may only carry Task-Id of
  # the bound lane (PR_AUTHOR_IDENTITY_MISMATCH otherwise). coordinator == the
  # integration lead account (Opselon). Lanes missing here are UNBOUND: the
  # declared Agent-Id check still applies, binding is a strengthening layer.
  agent_bindings:
    opselon: lead

# ---- Integration-owned (shared) files: any lane edit -> YELLOW ----------------
# These are the files every wave wants to touch. Lanes deliver APPEND blocks;
# ONLY the integration lead applies them, on an integration branch, via PR.
integration_owned:
  # ---- WAVE 4 backend: the host composition root + shared seams (lead applies only) ----
  - server/src/Livora.Server/Program.cs
  - server/src/Livora.Server/Modules/IFlivoraModule.cs
  - server/src/Livora.Server/Modules/ModuleRegistry.cs
  - server/src/Livora.Server/Platform/**
  - server/src/Livora.Server/appsettings.json
  - server/src/Livora.Server.Infrastructure/Persistence/LivoraDbContext.cs
  - server/src/Livora.Server.Infrastructure/Persistence/Entities.cs
  - server/src/Livora.Server.Infrastructure/Persistence/ModelSnapshots/**
  - server/src/Livora.Server.Application/ApiProblem.cs
  - server/src/Livora.Server.Application/Authorization.cs
  - server/src/Livora.Server.Application/Paging.cs
  - server/tests/Livora.Server.Tests/Fixtures/**
  - server/tests/Livora.Server.Tests/GlobalUsings.cs
  - server/**/Directory.Build.props
  - MauiProgram.cs
  - AppShell.xaml
  - AppShell.xaml.cs
  - App.xaml
  - App.xaml.cs
  - LIVORA.csproj
  - LIVORA.slnx
  - Tests/LIVORA.Tests.csproj
  - Resources/Localization/AppResources.resx
  - Resources/Localization/AppResources.fa.resx
  - Presentation/Views/Settings/SettingsPage.xaml
  - Presentation/ViewModels/Settings/SettingsViewModel.cs
  - Presentation/Theme.cs
  - Presentation/Components/TrExtension.cs
  - Resources/Styles/**
  - global.json
  - .gitignore
  - .gitattributes
  - docs/agents/**

# ---- Frozen contracts: lane edits -> RED (amendment = lead-only PR) ----------
# Case-variant and rename-landing attempts are caught by the engine
# (paths normalize; protected families match case-insensitively).
frozen:
  owner: lead
  paths:
    - Application/Abstractions/**
    - Domain/Enums/**
    - Application/Rules/RuleEngine.cs
    - Tests/Tests/ApplicationPurityTests.cs
    - Tests/Tests/Wave3Harness.cs
    - Tests/Tests/TestFakes.cs

# ---- Architecture config (workflow files, registry, scripts): RED for lanes --
architecture_owned:
  owner: lead
  paths:
    - .github/**
    - scripts/**
    - docs/LANES*.md
    - docs/WAVE3*.md
    - docs/architecture/**
    - docs/agents/WORKFLOW.md

# ---- Generated files: committed generated output -> YELLOW; engine floor
#      patterns (obj/**, bin/**, *.Designer.cs, ...) apply automatically.
generated:
  paths:
    - obj/**
    - bin/**
    - "**/*.Designer.cs"
    - "**/*.g.cs"
    - "**/*AssemblyInfo.cs"

# ---- Lane registry ------------------------------------------------------------
# Each active lane/agent registers here BEFORE opening a PR.
# lifecycle: planned | active | paused | stalled | superseded | merged | released | abandoned
# exclusive: v2 default true — two ACTIVE lanes with intersecting exclusive
#            claims make the REGISTRY invalid (RED) unless reconciled by an
#            overlap group or shared_branch. lead is the '**' catch-all default:
#            it never makes a path GREEN for non-lead lanes (LEAD_AMENDMENT).
lanes:
  - id: w3b-lane02
    agent: agent-b
    wave: 3b
    branch: agent/w3b/lane02-health-connect
    task: Health Connect foundation (Android), capability discovery, permissions
    owns:
      - Infrastructure/HealthProviders/**
      - Application/HealthData/Wave3b/**
      - Application/HealthData/Wave3bHealth/**
      - Tests/Tests/Wave3b*
      - Tests/Tests/Wave3b*/**
      - wave3b-keys/**
    status: stalled
    expiry: "2026-12-31"
  - id: w3b-lane03
    agent: agent-b
    wave: 3b
    branch: agent/w3b/lane03-activities
    task: WorkoutSession sources + adapter
    owns:
      - Application/Activities/**
      - wave3b-keys/**
    status: stalled
  - id: w3b-lane04
    agent: agent-b
    wave: 3b
    branch: agent/w3b/lane04-normalization
    task: provenance stamping, unit converter, payload validation
    owns:
      - Application/Normalization/**
      - wave3b-keys/**
    status: stalled
  - id: w3b-lane05
    agent: agent-b
    wave: 3b
    branch: agent/w3b/lane05-baselines
    task: 7/14/30 window baselines, sample gates, state confidence
    owns:
      - Application/State/Wave3b/**
      - wave3b-keys/**
    status: stalled
  - id: w3c-lane01
    agent: agent-c
    wave: 3c
    branch: agent/w3c/lane01-*
    task: (per WAVE3C brief) engine lane 01 — never activated
    owns: []
    status: superseded
  - id: w3c-lane02
    agent: agent-c
    wave: 3c
    branch: agent/w3c/lane02-*
    task: gateway config service + obfuscated key blob (the ONLY key owner)
    owns:
      - Infrastructure/Security/Gateway/**
    status: superseded
    exclusive: false
  - id: w3c-lane03
    agent: agent-c
    wave: 3c
    branch: agent/w3c/lane03-*
    task: AI provider/context/validator lane
    owns:
      - Application/Intelligence/**
      - Infrastructure/IntelligenceProviders/Wave3c/**
    status: superseded
  - id: w3c-lane04
    agent: agent-c
    wave: 3c
    branch: agent/w3c/lane04-*
    task: accounts/passcode + local data catalog lane
    owns:
      - Application/Accounts/**
      - Infrastructure/Persistence/Wave3c/**
    status: superseded
  - id: w3c-lane05
    agent: agent-c
    wave: 3c
    branch: wave3c/integration
    shared_branch: true          # historical lanes delivered on the wave integration branch
    task: adaptive plan engine + recommendation ranker + decision log
    owns:
      - Application/Planning/Adaptive/**
      - Application/Planning/Wave3b/**
    status: merged
  - id: w3c-lane06
    agent: agent-c
    wave: 3c
    branch: wave3c/integration
    shared_branch: true
    task: durable local-first storage, sync queue, migrations, perf budgets
    owns:
      - Application/Sync/**
      - Infrastructure/Persistence/Wave3b/**
    status: merged
  - id: w3c-lane07
    agent: agent-c
    wave: 3c
    branch: wave3c/integration
    shared_branch: true
    task: AI settings / Data Studio / Lock UI, motion, RTL/a11y, i18n fragments
    owns:
      - Presentation/Views/AiSettings/**
      - Presentation/Views/DataStudio/**
      - Presentation/Views/Security/**
      - Presentation/ViewModels/AiSettings/**
      - Presentation/ViewModels/DataStudio/**
      - Presentation/ViewModels/Security/**
      - Presentation/Views/Wave3cMotion.cs
      - wave3c-keys/**
      - Tests/Wave3c/**
    status: merged
  - id: w3c-lane01b
    agent: agent-c
    wave: 3c
    branch: wave3c/integration
    shared_branch: true
    task: consent store + secure storage (DPAPI) + passcode + catalog + honest cloud stub
    owns:
      - Infrastructure/Security/**
      - Infrastructure/Persistence/LocalDataCatalog.cs
      - Infrastructure/Persistence/LocalJsonStore.cs
    status: merged
  - id: integration-w3c
    agent: coordinator
    wave: 3c
    branch: wave3c/integration
    shared_branch: true
    task: wave-3c integration docs + lead-applied gate amendments + the completion merge
    owns:
      - docs/wave3c/**
      - Tests/Tests/Wave3ResxIntegrityTests.cs
      - Tests/Tests/Wave3c/**
      - Application/Patterns/**
      - Application/Planning/RecommendationService.cs
    status: released
  - id: lead
    agent: coordinator
    wave: all
    branch: integration/**
    task: contracts, APPEND application, merges, docs, ledger
    owns:
      - "**"
    status: active
  - id: qa
    agent: agent-a
    wave: all
    branch: qa/**
    task: verification lanes, adversarial checks (read-mostly; tests only under Tests/QA/**)
    owns:
      - Tests/QA/**
    status: active

  # ---- WAVE 4, Phase 1 lanes (audit + foundation). One row per lane; the gate classifies
  #      scope from these patterns, so a lane editing outside its row is YELLOW by design.
  - id: w4-p1a-architecture
    agent: agent-01
